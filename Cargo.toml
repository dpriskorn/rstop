[package]
name = "rstop"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.32"
procfs = "0.18"
libc = "0.2"
tabled = "0.20"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5.0"
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
# clippy is included with Rust, run with: cargo clippy